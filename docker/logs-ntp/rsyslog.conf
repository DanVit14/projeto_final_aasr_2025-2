# Configuração do rsyslog para receber logs centralizados

# Carregar módulos
module(load="imudp")
module(load="imtcp")

# Permitir receber logs remotos
$ModLoad imudp
$UDPServerRun 514
$ModLoad imtcp
$InputTCPServerRun 514

# Template para logs remotos (organizar por host)
$template RemoteLogs,"/var/log/remote/%HOSTNAME%/%PROGRAMNAME%.log"
$template RemoteLogsAll,"/var/log/remote/%HOSTNAME%/all.log"

# Regras para logs remotos
*.* ?RemoteLogsAll
& stop

# Logs locais do container
*.info;mail.none;authpriv.none;cron.none                /var/log/messages
authpriv.*                                              /var/log/secure
mail.*                                                  -/var/log/maillog
cron.*                                                  /var/log/cron
