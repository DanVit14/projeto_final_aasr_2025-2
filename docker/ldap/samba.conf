# Configuração do Samba Active Directory Domain Controller
# Este arquivo é um template - será gerado dinamicamente pelo init.sh

[global]
    workgroup = EMPRESA
    realm = empresa.local
    server role = active directory domain controller
    dns forwarder = 8.8.8.8
    netbios name = LDAP
    
    # Logging
    log file = /var/log/samba/log.%m
    log level = 1
    max log size = 50
    
    # Performance
    socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=131072 SO_SNDBUF=131072
    read raw = yes
    write raw = yes
    
    # Security
    security = ads
    encrypt passwords = yes
    
    # LDAP
    passdb backend = samba_dsdb
    
    # Kerberos
    dedicated keytab file = /etc/krb5.keytab
    kerberos method = secrets and keytab

# Compartilhamento Público (todos podem ler/escrever)
[public]
    path = /shared/public
    comment = Compartilhamento Público
    read only = no
    browseable = yes
    guest ok = yes
    force user = nobody
    force group = nogroup
    create mask = 0666
    directory mask = 0777

# Compartilhamento Privado (apenas usuários autenticados)
[private]
    path = /shared/private
    comment = Compartilhamento Privado
    read only = no
    browseable = yes
    guest ok = no
    valid users = @"EMPRESA\Users", @"EMPRESA\Admins"
    write list = @"EMPRESA\Users", @"EMPRESA\Admins"
    create mask = 0660
    directory mask = 0770
    force group = "EMPRESA\Users"
    
    # ACLs
    vfs objects = acl_xattr
    map acl inherit = yes
    store dos attributes = yes
