# Configuração básica do Samba AD
# Será expandida durante a implementação

[global]
    workgroup = EMPRESA
    realm = empresa.local
    server role = active directory domain controller
    dns forwarder = 8.8.8.8

[public]
    path = /shared/public
    read only = no
    browseable = yes

[private]
    path = /shared/private
    read only = no
    browseable = yes
