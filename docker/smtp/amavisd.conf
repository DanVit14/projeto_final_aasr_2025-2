# Configuração do Amavis (integração ClamAV + SpamAssassin)

# Habilitar ClamAV
@bypass_virus_checks_maps = (
   \%bypass_virus_checks, \@bypass_virus_checks_acl, \$bypass_virus_checks_re);

# Habilitar SpamAssassin
@bypass_spam_checks_maps = (
   \%bypass_spam_checks, \@bypass_spam_checks_acl, \$bypass_spam_checks_re);

# Porta do ClamAV
$virus_admin = "postmaster\@empresa.local";
$spam_admin = "postmaster\@empresa.local";

# Configuração do ClamAV — socket explícito (igual ao init: /var/run/clamav/clamd.ctl)
@av_scanners = (
  ['ClamAV-clamd', \&ask_daemon, ["CONTSCAN {}\n", "/var/run/clamav/clamd.ctl"],
   qr/\bOK$/m, qr/\bFOUND$/m,
   qr/^.*?: (?!Infected Archive)(.*) FOUND$/m ],
);

$max_servers = 2;
$child_timeout = 20*60;

# Logs
$log_level = 0;
$log_recip_templ = undef;
$DO_SYSLOG = 1;
$syslog_facility = 'mail';

# Quarantine
$QUARANTINEDIR = '/var/lib/amavis/virusmails';
$quarantine_subdir_levels = 1;
